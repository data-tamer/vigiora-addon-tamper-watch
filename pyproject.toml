[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamper-watch"
version = "1.0.0"
description = "A Vigiora add-on: reports cameras that are covered, blurred or moved."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
# The kit is not on a package index yet. Install it first (see README.md, "For developers").
# The image installs the exact versions in requirements.txt.
dependencies = ["vigiora-addon-kit>=0.2.0", "numpy>=1.26", "opencv-python-headless>=4.9"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tamper-watch = "tamper_watch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
